<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ថវិកាកម្មវិធី</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&display=swap">
<style>
/* Layout: phone-first single column. A maroon "envelope" card carries the title and the dollar total;
   each section below is a white card holding its items as labelled rows. */
:root{
  --bg:#f5eff1; --surface:#ffffff; --surface2:#faf6f7; --fg:#26161d; --muted:#6f5c64; --line:#e7dade;
  --accent:#8a1c3f; --accent-2:#6d1431; --on-accent:#fff7f0; --gold:#c29233; --gold-soft:#f6ead2;
  --good:#24834f; --good-soft:#e3f3ea; --bad:#b3261e; --shadow:0 1px 2px rgba(60,20,35,.06),0 4px 14px rgba(60,20,35,.06);
  --display:"Moul","Kantumruy Pro",serif; --body:"Kantumruy Pro",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150e11; --surface:#21171b; --surface2:#2a1e23; --fg:#f4eaee; --muted:#b9a5ad; --line:#3a2b31;
  --accent:#a8294f; --accent-2:#7d1a39; --on-accent:#fff4ec; --gold:#e2b45a; --gold-soft:#3a2f1c;
  --good:#5fc68c; --good-soft:#1d3327; --bad:#ff8a80; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150e11; --surface:#21171b; --surface2:#2a1e23; --fg:#f4eaee; --muted:#b9a5ad; --line:#3a2b31;
  --accent:#a8294f; --accent-2:#7d1a39; --on-accent:#fff4ec; --gold:#e2b45a; --gold-soft:#3a2f1c;
  --good:#5fc68c; --good-soft:#1d3327; --bad:#ff8a80; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1,h2{margin:0;text-wrap:balance}
input,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=tel],input[type=password]{
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;min-width:0;width:100%}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{border-color:var(--gold);outline:none}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;min-height:44px;font-weight:600}
button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
button.link{border:none;background:none;color:var(--accent);padding:4px 0;min-height:0;font-weight:500}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.note{font-size:.88rem;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:.92rem;margin:0;min-height:1.5em}
.num{font-variant-numeric:tabular-nums}

/* ---------- lock ---------- */
.lock{max-width:380px;margin:6vh auto 0;display:grid;gap:18px}
.lock-head{text-align:center;display:grid;gap:6px;justify-items:center}
.seal{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--gold);display:grid;place-items:center;
  font-family:var(--display);font-size:1.6rem;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold)}
.lock-head h1{font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--accent);line-height:1.9}
.lock form{display:grid;gap:14px;background:var(--surface);padding:20px;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.lock label{display:grid;gap:6px;font-size:.95rem;font-weight:600}
.lock input{font-size:1.15rem;letter-spacing:.06em}
.lock button.pri{min-height:50px;font-size:1.05rem}

/* ---------- envelope (hero card) ---------- */
.env{background:var(--accent);color:var(--on-accent);border-radius:18px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.env::after{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:12px;pointer-events:none}
.env>*{position:relative;z-index:1}
.env h1{font-family:var(--display);font-weight:400;font-size:1.2rem;line-height:1.9;color:var(--gold)}
.env .lbl{font-size:.85rem;opacity:.85}
.env .big{font-size:2.3rem;font-weight:700;line-height:1.15}
.env .bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.env .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}
.env .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.env .two>div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px}
.env .two b{font-size:1.15rem;display:block}
.env button{background:rgba(255,255,255,.12);border-color:transparent;color:var(--on-accent)}
.env .evname{background:transparent;border:1.5px dashed rgba(255,255,255,.35);color:var(--on-accent);font-size:1.25rem;font-weight:700}
.env .evname:focus{border-style:solid;border-color:var(--gold)}
.env .rate{display:flex;gap:8px;align-items:center;font-size:.9rem;flex-wrap:wrap}
.riel{font-size:1.25em;line-height:1}
.env .rate input{width:110px;min-height:38px;background:rgba(255,255,255,.12);border-color:transparent;color:var(--on-accent);text-align:right}
.status{font-size:.82rem;opacity:.85}

/* ---------- home ---------- */
.evlist{display:grid;gap:12px}
.evcard{display:grid;gap:8px;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);font-weight:400}
.evcard .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.evcard b{font-size:1.1rem}
.evcard .amt{font-weight:700;color:var(--accent);font-size:1.15rem;white-space:nowrap}
.evcard .sub{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.minibar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--good)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:6px}
.empty b{font-size:1.05rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{min-height:50px}

/* ---------- sections ---------- */
.cat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.cathead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.cathead input{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding:4px 6px;min-height:40px;flex:1}
.cathead input:focus{background:var(--surface);border-color:var(--gold)}
.sub-pill{background:var(--gold-soft);color:var(--fg);border-radius:99px;padding:2px 12px;font-weight:700;white-space:nowrap;font-size:.95rem}
.items{display:grid}
.item{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item.done{background:var(--good-soft)}
.it-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.chk{width:28px;height:28px;accent-color:var(--good);margin:0}
.item .nm{font-weight:600;border-color:transparent;background:transparent;padding:4px 6px;min-height:40px}
.item .nm:focus{background:var(--surface);border-color:var(--gold)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.icon-btn{width:40px;min-height:40px;padding:0;border:none;background:transparent;color:var(--muted);font-size:1.4rem;line-height:1;border-radius:8px}
.icon-btn:hover{background:var(--surface2);color:var(--bad)}
.it-fields{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:end;padding-left:36px}
.fld{display:grid;gap:2px;font-size:.78rem;color:var(--muted);font-weight:500}
.fld input{text-align:right;min-height:42px;padding:6px 10px;font-size:1rem;color:var(--fg)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;height:42px}
.seg button{border:none;border-radius:0;min-height:0;height:100%;padding:0 14px;font-size:1.2rem;min-width:44px;background:var(--surface);color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.it-total{padding-left:36px;display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.it-total b{color:var(--fg);font-size:1rem}
.catfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.catfoot .add{border-style:dashed;color:var(--accent);background:transparent}
.catfoot .link{color:var(--muted);font-size:.85rem}
.catfoot .link.sure{color:var(--bad)}
.cat-empty{padding:14px;color:var(--muted);font-size:.92rem;margin:0}

/* picker */
.picker{padding:14px;display:grid;gap:12px;background:var(--surface2);border-top:1px solid var(--line)}
.picker .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;min-height:40px;font-weight:500}
.chip.on{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.chip.on::before{content:"✓ "}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.edrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}

.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;gap:12px}
.tpl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tpl-head b{font-size:1.05rem}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{display:grid;gap:2px;text-align:left;padding:12px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);font-weight:400;min-height:72px;align-content:start}
.tcard b{font-size:1rem;line-height:1.5}
.tcard span{font-size:.8rem;color:var(--muted)}
.tcard:hover{border-color:var(--gold)}
.tcard.blank{border-style:dashed;background:transparent}
.tedit{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.addcat{display:grid;grid-template-columns:1fr auto;gap:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools .pri{grid-column:1/-1;min-height:50px;font-size:1.05rem}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--bad);padding:12px 14px;border-radius:var(--r)}
.confirm .pri{background:var(--bad);border-color:var(--bad)}
.toast{text-align:center}
@media (max-width:380px){.it-fields{grid-template-columns:64px 1fr;padding-left:0}.it-fields .seg{grid-column:1/-1;justify-self:start}.it-total{padding-left:0}.env .big{font-size:2rem}}
@media (prefers-reduced-motion:reduce){.env .bar i{transition:none}}
</style>
</head>
<body>

<!-- LOCK -->
<section id="lock" class="lock">
  <div class="lock-head">
    <div class="seal">៛</div>
    <h1>ថវិកាកម្មវិធី</h1>
    <p class="note" id="lockLoading">កំពុងភ្ជាប់…</p>
  </div>

  <form id="fLogin" hidden>
    <label>លេខទូរស័ព្ទ<input type="tel" id="liPhone" inputmode="tel" autocomplete="tel" placeholder="012 345 678" required></label>
    <label>លេខកូដ<input type="password" id="liPin" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••" required></label>
    <p class="err" id="liErr"></p>
    <button class="pri" type="submit">ចូល</button>
    <div class="row between"><button class="link" type="button" id="toRegister">ចុះឈ្មោះថ្មី</button><button class="link" type="button" id="toForgot">ភ្លេចលេខកូដ?</button></div>
  </form>

  <form id="fPhone" hidden>
    <p class="note" id="phTitle"></p>
    <label>លេខទូរស័ព្ទ<input type="tel" id="phPhone" inputmode="tel" autocomplete="tel" placeholder="012 345 678" required></label>
    <label id="phCodeBox" hidden>លេខកូដផ្ទៀងផ្ទាត់ (៦ ខ្ទង់)<input type="text" id="phCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <p class="err" id="phErr"></p>
    <button class="pri" type="submit" id="phBtn">បន្ត</button>
    <button class="link" type="button" id="phBack">‹ ត្រឡប់ទៅចូល</button>
    <div id="recaptcha"></div>
  </form>

  <form id="fPin" hidden>
    <p class="note">កំណត់លេខកូដសម្រាប់ចូលកម្មវិធី</p>
    <label>លេខកូដ (៤–៦ ខ្ទង់)<input type="password" id="pnPin" inputmode="numeric" maxlength="6" autocomplete="new-password" required></label>
    <label>បញ្ជាក់លេខកូដម្តងទៀត<input type="password" id="pnPin2" inputmode="numeric" maxlength="6" autocomplete="new-password" required></label>
    <p class="err" id="pnErr"></p>
    <button class="pri" type="submit">រក្សាទុក និងចូល</button>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <!-- HOME -->
  <section id="home" class="wrap">
    <div class="env">
      <div class="row between"><h1>ថវិកាកម្មវិធី</h1><button id="logout">ចាកចេញ</button></div>
      <div><div class="lbl">កម្មវិធីទាំងអស់របស់អ្នក</div><div class="note" style="color:inherit;opacity:.85" id="homeSum"></div></div>
    </div>
    <button class="pri" id="newEv" style="min-height:52px;font-size:1.05rem">+ បង្កើតកម្មវិធីថ្មី</button>
    <div class="tpl" id="tplBox" hidden></div>
    <div class="evlist" id="evlist"></div>
    <p class="note toast" id="storeNote"></p>
  </section>

  <!-- EVENT -->
  <section id="event" class="wrap" hidden>
    <div class="env">
      <div class="row between">
        <button id="back">‹ ត្រឡប់</button>
        <span class="status" id="st"></span>
      </div>
      <input type="text" class="evname" id="evName" aria-label="ឈ្មោះកម្មវិធី">
      <div><div class="lbl">ចំណាយសរុប (ដុល្លារ)</div><div class="big num" id="tot">$0</div></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="two">
        <div><span class="lbl">✓ ទិញរួច</span><b class="num" id="paid">$0</b></div>
        <div><span class="lbl">នៅសល់</span><b class="num" id="left">$0</b></div>
      </div>
      <label class="rate" for="rate">អត្រាប្តូរប្រាក់ $1 = <input type="number" id="rate" min="1" inputmode="decimal"> <span class="riel">៛</span></label>
    </div>
    <div id="cats" class="wrap"></div>
    <div class="addcat">
      <input type="text" id="newCat" placeholder="ឈ្មោះផ្នែកថ្មី ឧ. ដឹកជញ្ជូន" list="catNames">
      <button id="addCat">+ បន្ថែមផ្នែក</button>
    </div>
    <datalist id="catNames"></datalist>
    <div class="tools">
      <button class="pri" id="print">🖨 ព្រីន</button>
      <button id="copy">ចម្លងសង្ខេប</button>
      <button id="saveTpl">☆ រក្សាទុកជាគំរូ</button>
      <button id="delEv" class="danger" style="grid-column:1/-1">លុបកម្មវិធី</button>
    </div>
    <div class="confirm" id="delConfirm" hidden>
      <span>លុបកម្មវិធីនេះជារៀងរហូតមែនទេ?</span>
      <div class="row"><button id="delNo">ទេ</button><button class="pri" id="delYes">លុប</button></div>
    </div>
    <p class="note toast" id="msg"></p>
  </section>
</div>

<script type="module">

<h1>${esc(e.name)}</h1><div>កាលបរិច្ឆេទ: ${new Date().toLocaleDateString("en-GB")} · អត្រា $1 = ${e.rate} ៛</div>
<div class="sum"><div>សរុប<b>${usd(t)}</b></div><div>ទិញរួច<b>${usd(p)}</b></div><div>នៅសល់<b>${usd(t-p)}</b></div></div>
<table><tr><th>ល.រ</th><th>មុខទំនិញ</th><th>ចំនួន</th><th>តម្លៃ</th><th>សរុប</th><th>✓</th></tr>${rows}
<tr class="h"><td colspan="5">សរុបទាំងអស់ (ដុល្លារ)</td><td>${usd(t)}</td></tr></table>
<div class="p"><button onclick="print()">🖨 ព្រីន</button></div>
<script>window.onload=()=>setTimeout(()=>print(),600)<\/script></body></html>`}
$("print").onclick=()=>{const w=window.open("","_blank");
  if(!w){$("msg").textContent="សូមអនុញ្ញាត pop-up ដើម្បីព្រីន។";return}
  w.document.open();w.document.write(printDoc(events[cur]));w.document.close()};

/* ---------- boot ---------- */
async function startData(){
  show("home");$("evlist").innerHTML=`<p class="note">កំពុងផ្ទុក…</p>`;
  try{const [l,t]=await Promise.all([getDoc(doc(fs,"users",uid,"settings","library")),getDoc(doc(fs,"users",uid,"settings","templates"))]);
    lib=(l.data()||{}).cats||null;tpls=(t.data()||{}).list||null;var tplVer=(t.data()||{}).ver||1}catch(e){lib=null;tpls=null}
  if(!lib)lib=JSON.parse(JSON.stringify(DEFLIB));
  if(!tpls){tpls=JSON.parse(JSON.stringify(DEFTPL));saveTpls()}
  else if(tplVer<TPLVER){ // add the new clothing section to an existing wedding template
    const w=tpls.find(t=>t.n==="មង្គលការ"),def=DEFTPL[0].cats.find(c=>c.n==="ខោអាវ");
    if(w&&!w.cats.some(c=>c.n==="ខោអាវ"))w.cats.splice(Math.min(3,w.cats.length),0,JSON.parse(JSON.stringify(def)));
    saveTpls()}
  ["ខោអាវបងតុលា","រ៉ូបបងតុលា","ស្បែកជើងកែង","កក់សម្លៀកបំពាក់បុរាណ"].forEach(n=>{const L=libFor("ខោអាវ");if(!L.includes(n))L.push(n)});
  if(unsub)unsub();
  unsub=onSnapshot(collection(fs,"users",uid,"events"),snap=>{
    const next={};snap.docs.forEach(s=>{const v=s.data();if(v)next[s.id]=JSON.parse(JSON.stringify(v))});
    if(cur&&dirty&&events[cur])next[cur]=events[cur];
    events=next;
    $("storeNote").textContent="រក្សាទុកនៅលើ Firebase — ចូលពីឧបករណ៍ណាក៏បាន ដោយលេខទូរស័ព្ទ និងលេខកូដ។";
    if(!$("home").hidden)renderHome();
    else if(cur&&!events[cur]){cur=null;renderHome();show("home")}
  },e=>{$("storeNote").textContent="ភ្ជាប់មិនបាន ("+(e.code||"")+") — ពិនិត្យ Firestore Rules។"});
}
await setPersistence(auth,browserSessionPersistence).catch(()=>{});
onAuthStateChanged(auth,u=>{
  if(!u)return leaveApp();
  if(settingPin)return;
  const hasPw=u.providerData.some(p=>p.providerId==="password");
  if(!hasPw){settingPin=true;showForm("fPin");return}
  enterApp(u);
});
</script>
</body>
</html>
